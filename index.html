*{box-sizing:border-box}

.btn.alt{background:#e3e6ea;color:#1c1e21}
.row{display:flex;gap:8px;flex-wrap:wrap}
select{padding:9px;border-radius:8px;border:1px solid #ccc;font-family:inherit;font-size:1rem;width:100%;margin:6px 0}
.hide{display:none}
.big{font-size:2rem;font-weight:800;text-align:center}
.note{font-size:.8rem;color:#666}
.w{border-bottom:1px solid #eee;padding:8px 0}
</style>
</head>

<div class="wrap">
<h1>QCM الثقافة العامة - مباراة الأمن الوطني</h1>

</div>
<div id="quiz" class="card hide">

  <div class="q" id="qt"></div>
  <div id="opts"></div>
  <div class="exp hide" id="exp"></div>
  <button class="btn hide" id="next">التالي</button>
</div>
<div id="end" class="card hide">

  <p id="msg" style="text-align:center"></p>

    <button class="btn alt" id="rev">مراجعة الأخطاء</button>
    <button class="btn alt" id="retry">إعادة الأخطاء فقط</button>
  </div>
  <div id="wrong"></div>
</div>
</div>

const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cats=[...new Set(Q.map(x=>x.c))];
$("cat").innerHTML='<option value="">كل الأقسام ('+Q.length+' سؤال)</option>'+cats.map(c=>'<option>'+c+'</option>').join("");
$("count").textContent="عدد الأسئلة: "+Q.length;
let list=[],i=0,score=0,wrong=[],done=false;
function start(arr){list=arr;i=0;score=0;wrong=[];$("start").classList.add("hide");$("end").classList.add("hide");$("quiz").classList.remove("hide");show()}
$("go").onclick=()=>{let a=Q.filter(x=>!$("cat").value||x.c===$("cat").value);const m=$("mode").value;if(m==="rand")a=shuf(a);if(m==="20")a=shuf(a).slice(0,20);start(a)};
function show(){done=false;const x=list[i];$("pos").textContent="السؤال "+(i+1)+" / "+list.length;$("sc"). textContent="النقاط: "+score;$("ct").textContent=x.c;$("pb").style.width=(i/list.length*100)+"%";$("qt").textContent=x.q;$("exp").classList.add("hide");$("next").classList.add("hide");
const o=shuf([x.ok,...x.w]);$("opts").innerHTML="";o.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(b,t,x);$("opts").appendChild(b)})}
function pick(b,t,x){if(done)return;done=true;[...$("opts").children].forEach(e=>{e.disabled=true;if(e.textContent===x.ok)e.classList.add("ok")});
if(t===x.ok)score++;else{b.classList.add("no");wrong.push(x)}
$("sc").textContent="النقاط: "+score;$("exp").innerHTML="<b>الجواب: "+x.ok+"</b><br>"+x.e;$("exp").classList.remove("hide");$("next").textContent=i===list.length-1?"النتيجة":"التالي";$("next").classList.remove("hide")}
$("next").onclick=()=>{i++;if(i>=list.length)finish();else show()};
function finish(){$("quiz").classList.add("hide");$("end").classList.remove("hide");const p=Math.round(score/list.length*100);$("final").textContent=score+" / "+list.length+" ("+p+"%)";$("msg").textContent=p>=80?"ممتاز، واصل!":p>=50?"مزيان، زيد راجع الأخطاء":"خاصك تعاود المراجعة";$("wrong").innerHTML="";$("retry").style.display=wrong.length?"":"none";$("rev").style.display=wrong.length?"":"none"}
$("rev").onclick=()=>{$("wrong").innerHTML=wrong.map(x=>'<div class="w"><b>'+x.q+'</b><br>الجواب: '+x.ok+'<br><span class="note">'+x.e+'</span></div>').join("")};
$("retry").onclick=()=>start(shuf(wrong));
$("again").onclick=()=>{$("end").classList.add("hide");$("start").classList.remove("hide")};
</script>
